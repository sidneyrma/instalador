# ============================================================
# CONFIGURAÇÃO NGINX — Portal O Despertar (compraoseu.com)
# Servidor: Contabo (aaPanel)
# ============================================================
# Como usar no aaPanel:
# 1) Crie o site normalmente (domínio compraoseu.com)
# 2) Acesse: Sites → compraoseu.com → Configuração → arquivo de configuração
# 3) Encontre o bloco  "location / { ... }"  e adicione a linha try_files
#    deixando assim:
#
#    location / {
#        try_files $uri $uri.html $uri/index.html =404;
#    }
#
# 4) Salve e reinicie o Nginx (botão "Reload")
#
# Isso faz as URLs bonitas funcionarem:
#   /livro01  ->  livro01.html
#   /         ->  index.html

# Bloco completo de referência (server):
#
# server {
#     listen 80;
#     server_name compraoseu.com www.compraoseu.com;
#     root /www/wwwroot/compraoseu.com;
#     index index.html;
#
#     location / {
#         try_files $uri $uri.html $uri/index.html =404;
#     }
#
#     # cache de arquivos estáticos (imagens/ícones) — ajuda o site a carregar rápido
#     location ~* \.(png|jpg|jpeg|webp|gif|svg|ico|css|js|json|xml)$ {
