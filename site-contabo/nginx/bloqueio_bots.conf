# ============================================================
# BLOQUEIO DE BOTS / VARREDURAS MALICIOSAS — NGINX
# Cole este bloco DENTRO do server { } do site compraoseu.com
# (Website → compraoseu.com → Config → antes do access_log)
# ============================================================

# Bloqueia tentativas de explorar arquivos sensíveis (retorna 444 = corta conexão)
location ~* \.(env|git|log|bak|sql|sh|conf|yml|yaml|ini|htaccess|htpasswd)$ {
    return 444;
}
location ~* (\.env|\.git|config\.php|wp-login\.php|wp-admin|xmlrpc\.php|info\.php|phpinfo|server-status|server-info|\.well-known/acme-challenge/.*\.(php|jsp|py|js)$) {
    return 444;
}

# Bloqueia caminhos comuns de ataque (WordPress, Laravel, Vite, etc.)
location ~* ^/(wp-|wordpress|administrator|admin/login|user/login|actuator|telescope|console|api/env|@vite|trace\.axd|this_is_a_new|classwithtostring) {
    return 444;
}

# Bloqueia por User-Agent de bots maliciosos conhecidos
if ($http_user_agent ~* (sqlmap|nikto|nessus|nmap|masscan|curl|wget|python-requests|Go-http-client|libwww-perl|ZmEu|acunetix|fimap|havij|scanner)) {
    return 444;
}

# Limita taxa de requisições por IP (protege contra ataques de força bruta)
limit_req_zone $binary_remote_addr zone=geral:10m rate=20r/s;

# ============================================================
# NOTA: A linha "limit_req_zone" DEVE ficar fora do server {}
# (no topo do arquivo, junto com as outras diretivas globais).
# Use apenas a linha abaixo DENTRO do server {} se quiser aplicar:
#   limit_req zone=geral burst=40 nodelay;
# ============================================================
